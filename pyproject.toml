[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goose-decoding"
version = "1.0.0"
description = "Anisotropic speculation trees for training-free speculative decoding"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Tao Jin", email = "morgan@jaist.ac.jp" },
    { name = "Phuong Minh Nguyen" },
    { name = "Naoya Inoue" },
]
keywords = ["speculative decoding", "llm inference", "lossless acceleration"]
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.26",   # device_map, used by the benchmark runner and the README example
]

[project.optional-dependencies]
benchmarks = ["datasets>=2.19"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/2kinto/GOOSE_Speculative_Decoding"

[tool.setuptools]
packages = ["goose"]
